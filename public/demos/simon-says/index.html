<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Simon Says</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500&display=swap" rel="stylesheet">
	<!-- Use Google Fonts version of a mono font close to Geist Mono if Geist Mono is not fully supported, but we'll include Geist Mono -->
	<link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="style.css">
</head>
<body>
	<div class="container">
		<h1>simon says</h1>
		
		<div class="info-panel">
			<div class="info-row">
				<div id="score">Score: 0 | Best: 0 | Seq: 0</div>
			</div>
			<div class="info-row">
				<div id="state-display" class="state-indicator">STATE: IDLE</div>
				<div id="difficulty-display" class="difficulty-indicator">DIFFICULTY: MEDIUM</div>
			</div>
			<div class="info-row">
				<div id="performance-display" class="performance-indicator">AVG REACTION: --</div>
			</div>
		</div>

		<div class="difficulty-selector">
			<button class="difficulty-btn" data-difficulty="easy">EASY</button>
			<button class="difficulty-btn active" data-difficulty="medium">MEDIUM</button>
			<button class="difficulty-btn" data-difficulty="hard">HARD</button>
		</div>

		<div class="game-board">
			<button class="color-btn" id="green"></button>
			<button class="color-btn" id="red"></button>
			<button class="color-btn" id="yellow"></button>
			<button class="color-btn" id="blue"></button>
		</div>
		
		<button id="start-btn">START GAME</button>
		<div id="message"></div>
	</div>
	<script src="script.js"></script>
</body>
</html>
