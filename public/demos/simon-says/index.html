<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Simon Says</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@100..900&family=Instrument+Serif:ital@0;1&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet" />
  
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <!-- Header -->
    <header class="game-header">
      <h1 class="title">simon says</h1>
      <div id="state-display" class="state-pill">
        <span class="status-dot"></span>
        <span id="state-text">IDLE</span>
      </div>
    </header>

    <!-- Score Bar -->
    <div class="score-bar" aria-label="Score Board">
      <div class="score-item">
        <span class="score-label">SCORE</span>
        <span id="score-val" class="score-value">0</span>
      </div>
      <div class="score-item">
        <span class="score-label">BEST</span>
        <span id="best-val" class="score-value">0</span>
      </div>
      <div class="score-item">
        <span class="score-label">STEP</span>
        <span id="seq-val" class="score-value">0</span>
      </div>
    </div>

    <!-- Hidden compatibility elements for existing logic -->
    <div style="display: none;">
      <div id="score"></div>
      <div id="difficulty-display"></div>
      <div id="performance-display"></div>
    </div>

    <!-- Simon Console -->
    <main class="console-wrapper">
      <div class="game-board" id="game-board">
        <button class="color-btn pad-green" id="green" aria-label="Green pad"></button>
        <button class="color-btn pad-red" id="red" aria-label="Red pad"></button>
        <button class="color-btn pad-yellow" id="yellow" aria-label="Yellow pad"></button>
        <button class="color-btn pad-blue" id="blue" aria-label="Blue pad"></button>
      </div>
    </main>

    <!-- Status Message -->
    <div id="message" class="status-msg">PRESS START TO PLAY</div>

    <!-- Controls -->
    <div class="controls">
      <button id="start-btn" class="primary-btn">START GAME</button>
      
      <!-- Difficulty Selector -->
      <div class="difficulty-group" role="radiogroup" aria-label="Difficulty">
        <button class="difficulty-btn" data-difficulty="easy">EASY</button>
        <button class="difficulty-btn active" data-difficulty="medium">MEDIUM</button>
        <button class="difficulty-btn" data-difficulty="hard">HARD</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
